name: pubtracker
services:
  proxy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
      - keycloak
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tells Keycloak its own routes live under /auth, so the login pages/redirects it
      # generates are already correct once the `proxy` container forwards /auth/* to it
      # unmodified - no path rewriting needed on the Caddy side.
      KC_HTTP_RELATIVE_PATH: /auth
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
  api:
    container_name: api
    restart: unless-stopped
    build:
      context: ../api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: '${DATABASE_URL_LOCAL:-Host=db;Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}}'
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Scheduler__PollIntervalHours: ${SCHEDULER_POLL_INTERVAL_HOURS}
      Email__ApiKey: ${EMAIL_API_KEY}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS}
      Email__FromName: ${EMAIL_FROM_NAME}
      Ncbi__ApiKey: ${NCBI_API_KEY}
      Ncbi__ContactEmail: ${NCBI_CONTACT_EMAIL}
      OpenAi__ApiKey: ${OPENAI_API_KEY}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY}
      # Authority is the browser-facing URL (must match the `iss` claim Keycloak stamps on
      # tokens); MetadataAddress is this container's own path to Keycloak over the Docker
      # network, for fetching signing keys - see the comment above ConfigureKeycloakBearer
      # in Program.cs for why these must differ inside Docker.
      Keycloak__Authority: ${WEB_KEYCLOAK_AUTHORITY:-http://localhost/auth/realms/science-alerts-saas}
      Keycloak__MetadataAddress: http://keycloak:8080/auth/realms/science-alerts-saas/.well-known/openid-configuration
      Keycloak__Audience: science-alerts-api
      # Web and api now share one origin behind the proxy, so this is effectively same-origin -
      # kept explicit for correctness/documentation rather than relying on that implicitly.
      Cors__WebAppOrigin: ${WEB_API_BASE_URL:-http://localhost}
  web:
    container_name: web
    restart: unless-stopped
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost}
        VITE_KEYCLOAK_AUTHORITY: ${WEB_KEYCLOAK_AUTHORITY:-http://localhost/auth/realms/science-alerts-saas}
        VITE_KEYCLOAK_CLIENT_ID: ${WEB_KEYCLOAK_CLIENT_ID:-science-alerts-web}
    depends_on:
      - api

volumes:
  postgres_data: