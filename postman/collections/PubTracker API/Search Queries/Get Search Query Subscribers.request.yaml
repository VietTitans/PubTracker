$kind: http-request
name: 'Get Search Query Subscribers'
method: GET
url: '{{base_url}}/api/v1/searchqueries/:searchQueryId/users?page=1&pageSize=20'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
pathVariables:
  - key: searchQueryId
    value: '1'
queryParams:
  - key: page
    value: '1'
  - key: pageSize
    value: '20'
