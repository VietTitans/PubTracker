$kind: http-request
name: List Database Suggestions
method: GET
url: '{{base_url}}/api/v1/databasesuggestions?page=1&pageSize=20'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
queryParams:
  - key: page
    value: '1'
  - key: pageSize
    value: '20'
