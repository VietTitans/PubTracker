$kind: http-request
name: Submit Feedback
method: POST
url: '{{base_url}}/api/v1/feedback'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "type": "bug",
      "message": "Something is not working as expected."
    }
