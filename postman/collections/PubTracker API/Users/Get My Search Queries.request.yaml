$kind: http-request
name: Get My Search Queries
method: GET
url: '{{base_url}}/api/v1/users/me/search-queries?page=1&pageSize=20'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
queryParams:
  - key: page
    value: '1'
  - key: pageSize
    value: '20'
