name: pubtracker-jenkins
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pubtracker-jenkins
    restart: unless-stopped
    # Runs as root so it can read/write the host's docker.sock (mounted below) and so the
    # ephemeral build containers it spawns (which inherit this UID via `.inside()`) can too.
    # Fine for local single-dev CI; would need a docker-group/rootless setup for anything
    # more sensitive.
    user: root
    ports:
      - "8090:8080"   # Jenkins UI — 8080/8081/5173 are already used by docker/docker-compose.yml
      - "50000:50000" # inbound agent port; unused for now (single built-in node), harmless to expose
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
